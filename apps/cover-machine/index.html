      _resizeObserver: null,
      _autosaveTimer: null,
      _isApplyingProject: false,
      _autosaveLargeAssetWarned: false,

      init() {
        try {
          Toast.init();
          this.cacheDom();
          this.applyBrandAssets();
          this.setupPresetMenus();
          this.setupExportTargets();
          this.setupFontPicker();
          this.setupEventListeners();
          this.setupPasteHandler();
          this.updateTelemetryUI();
          const restored = this.restoreAutosave();
          if (!restored) {
            this.applyProject(this.createDefaultProject(), { skipAutosave: true });
          }
          this.updateValidation();
          this.handleResize();
          this.fitSongText();
          this.scheduleAutosave();

          this._onResize = () => {
            if (this._resizeRaf) cancelAnimationFrame(this._resizeRaf);
            this._resizeRaf = requestAnimationFrame(() => {
              this._resizeRaf = null;
              this.handleResize();
            });
          };

          window.addEventListener('resize', this._onResize);

          if ('ResizeObserver' in window) {
            this._resizeObserver = new ResizeObserver(() => this.handleResize());
            this._resizeObserver.observe(this.dom.controls);
          }

          if (document.fonts?.ready) {
            document.fonts.ready.then(() => this.requestFitSongText()).catch(() => {});
          }

          this._onBeforeUnload = () => this.teardown();
          window.addEventListener('beforeunload', this._onBeforeUnload);

          Logger.info('App initialized');
          Telemetry.track('app_ready', {
            exportTarget: this.state.exportTarget,
            hasLogo: this.state.hasLogo,
            font: getSelectedFontFamily(this.dom.selSongFont)
          });
        } catch (err) {
          Logger.error('App init failed:', err);
          Toast.show(`初始化失败: ${toUserErrorMessage(err)} 请刷新页面后重试。`, 'error', 6000);
        }
      },

      teardown() {
        if (this._resizeRaf) cancelAnimationFrame(this._resizeRaf);
        if (this._fitRaf) cancelAnimationFrame(this._fitRaf);
        if (this._willChangeTimer) clearTimeout(this._willChangeTimer);
        if (this._autosaveTimer) clearTimeout(this._autosaveTimer);
        if (this._resizeObserver) this._resizeObserver.disconnect();
        if (this._onResize) window.removeEventListener('resize', this._onResize);
        if (this._onDocumentClick) document.removeEventListener('click', this._onDocumentClick);
        if (this._onBeforeUnload) window.removeEventListener('beforeunload', this._onBeforeUnload);
        revokeAllObjectUrls();
      },

      cacheDom() {
        this.dom = {
          controls: document.getElementById('controls'),
          brandLogo: document.getElementById('brandLogo'),
          previewWrapper: document.getElementById('preview-wrapper'),
          artworkCanvas: document.getElementById('artwork-canvas'),

          bgInput: document.getElementById('bgInput'),
          logoInput: document.getElementById('logoInput'),
          mainBg: document.getElementById('main-bg'),
          bgLayer: document.getElementById('bgLayer'),
          texNoise: document.getElementById('texNoise'),

          topMeta: document.getElementById('topMeta'),
          layoutLayer: document.getElementById('layoutLayer'),
          layoutContainer: document.getElementById('layoutContainer'),

          logoBox: document.getElementById('logoBox'),
          logoImg: document.getElementById('logo-img'),
          btnLogoColor: document.getElementById('btnLogoColor'),
          btnOpenDemo: document.getElementById('btnOpenDemo'),
          btnResetProject: document.getElementById('btnResetProject'),
          selPreset: document.getElementById('selPreset'),
          btnSavePreset: document.getElementById('btnSavePreset'),

          btnShadow: document.getElementById('btnShadow'),
          btnBlend: document.getElementById('btnBlend'),
          btnMeta: document.getElementById('btnMeta'),
          btnBW: document.getElementById('btnBW'),
          btnNoise: document.getElementById('btnNoise'),
          btnSafe: document.getElementById('btnSafe'),
          btnLayout: document.getElementById('btnLayout'),
          btnCase: document.getElementById('btnCase'),

          selSongFont: document.getElementById('selSongFont'),
          fontPicker: document.getElementById('fontPicker'),
          fontPickerButton: document.getElementById('fontPickerButton'),
          fontPickerMenu: document.getElementById('fontPickerMenu'),
          btnFontPrev: document.getElementById('btnFontPrev'),
          btnFontNext: document.getElementById('btnFontNext'),
          rngSpace: document.getElementById('rngSpace'),
          rngTitleSize: document.getElementById('rngTitleSize'),
          rngArtistSize: document.getElementById('rngArtistSize'),
          rngMetaSize: document.getElementById('rngMetaSize'),
          titleSizeValue: document.getElementById('titleSizeValue'),
          artistSizeValue: document.getElementById('artistSizeValue'),
          metaSizeValue: document.getElementById('metaSizeValue'),
          rngBgZoom: document.getElementById('rngBgZoom'),
          rngBgX: document.getElementById('rngBgX'),
          rngBgY: document.getElementById('rngBgY'),
          rngBgRot: document.getElementById('rngBgRot'),
          bgZoomValue: document.getElementById('bgZoomValue'),
          bgXValue: document.getElementById('bgXValue'),
          bgYValue: document.getElementById('bgYValue'),
          bgRotValue: document.getElementById('bgRotValue'),
          btnBold: document.getElementById('btnBold'),

          selLayerMode: document.getElementById('selLayerMode'),
          selExportTarget: document.getElementById('selExportTarget'),
          colorPicker: document.getElementById('colorPicker'),

          saveBtnPng: document.getElementById('saveBtnPng'),
          saveBtnJpg: document.getElementById('saveBtnJpg'),
          btnRetryExport: document.getElementById('btnRetryExport'),
          btnDownloadProject: document.getElementById('btnDownloadProject'),
          validationPanel: document.getElementById('validationPanel'),
          exportStatus: document.getElementById('exportStatus'),
          btnTelemetry: document.getElementById('btnTelemetry'),
          safeZone: document.getElementById('safeZone'),

          artistText: document.getElementById('artistText'),
          songText: document.getElementById('songText'),
          textGroup: document.getElementById('textGroup')
        };
      },

      applyBrandAssets() {
        if (!this.dom?.brandLogo) return;
        this.dom.brandLogo.src = DEFAULT_LOGO_SRC;
        this.dom.brandLogo.addEventListener('error', () => {
          this.dom.brandLogo.style.display = 'none';
        }, { once: true });
      },

      readCustomPresets() {
        const parsed = safeJsonParse(localStorage.getItem(PRESET_STORAGE_KEY), {});
        return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
      },

      writeCustomPresets(presets) {
        try {
          localStorage.setItem(PRESET_STORAGE_KEY, JSON.stringify(presets || {}));
        } catch (err) {
          Logger.warn('writeCustomPresets failed:', err);
          Toast.show('预设保存失败，浏览器存储空间可能已满。', 'warn', 3500);
        }
      },

      setupPresetMenus() {
        if (!this.dom?.selPreset) return;
        const customPresets = this.readCustomPresets();
        this.dom.selPreset.innerHTML = '';

        Object.entries(BUILT_IN_PRESETS).forEach(([value, preset]) => {
          const opt = document.createElement('option');
          opt.value = value;
          opt.textContent = `预设: ${preset.name}`;
          this.dom.selPreset.appendChild(opt);
        });

        Object.keys(customPresets).sort().forEach((name) => {
          const opt = document.createElement('option');
          opt.value = `custom:${name}`;
          opt.textContent = `自定义: ${name}`;
          this.dom.selPreset.appendChild(opt);
        });
      },

      setupExportTargets() {
        if (!this.dom?.selExportTarget) return;
        const current = this.dom.selExportTarget.value || DEFAULT_EXPORT_TARGET.id;
        this.dom.selExportTarget.innerHTML = '';

        Object.values(EXPORT_TARGETS).forEach((target) => {
          const opt = document.createElement('option');
          opt.value = target.id;
          opt.textContent = target.optionLabel;
          this.dom.selExportTarget.appendChild(opt);
        });

        this.dom.selExportTarget.value = getExportTarget(current).id;
      },

      getFontOptions() {
        return Array.from(this.dom.selSongFont.options).map((opt, index) => ({
          index,
          value: opt.value,
          label: (opt.textContent || '').trim(),
          family: opt.dataset.family || '',
          group: opt.parentElement?.label || ''
        }));
      },

      getFontOptionByValue(value) {
        return this.getFontOptions().find((item) => item.value === value) || null;
      },

      getCurrentFontIndex() {
        const opts = this.getFontOptions();
        const idx = opts.findIndex((item) => item.value === this.dom.selSongFont.value);
        return idx >= 0 ? idx : 0;
      },

      setupFontPicker() {
        if (!this.dom?.fontPickerMenu || !this.dom?.selSongFont) return;

        const menu = this.dom.fontPickerMenu;
        menu.innerHTML = '';

        let lastGroup = '';
        this.getFontOptions().forEach((item) => {
          if (item.group !== lastGroup) {
            lastGroup = item.group;
            const group = document.createElement('div');
            group.className = 'font-menu-group';
            group.textContent = item.group || 'Fonts';
            menu.appendChild(group);
          }

          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'font-option';
          btn.setAttribute('role', 'option');
          btn.dataset.value = item.value;
          btn.dataset.family = item.family;
          btn.dataset.index = String(item.index);
          btn.style.fontFamily = item.value;

          const sample = document.createElement('span');
          sample.className = 'font-sample';
          sample.textContent = 'openFAD 中文 123';

          const name = document.createElement('span');
          name.className = 'font-name';
          name.textContent = item.label;

          btn.appendChild(sample);
          btn.appendChild(name);
          menu.appendChild(btn);
        });

        this.updateFontPickerUI();
      },

      isFontMenuOpen() {
        return !!this.dom.fontPickerMenu?.classList.contains('open');
      },

      openFontMenu() {
        this._fontPreviewValue = null;
        this.dom.fontPickerMenu.classList.add('open');
        this.dom.fontPickerButton.setAttribute('aria-expanded', 'true');
        this.updateFontOptionStates();
        this.scrollActiveFontIntoView();
      },

      closeFontMenu({ restore = true } = {}) {
        if (!this.dom?.fontPickerMenu) return;
        this.dom.fontPickerMenu.classList.remove('open');
        this.dom.fontPickerButton.setAttribute('aria-expanded', 'false');
        this._fontPreviewValue = null;
        this.updateFontOptionStates();
        if (restore) this.restoreCommittedFontPreview();
      },

      toggleFontMenu() {
        if (this.isFontMenuOpen()) this.closeFontMenu({ restore: true });
        else this.openFontMenu();
      },

      previewFontValue(value, family) {
        if (!value) return;
        ensureFont(family || this.getFontOptionByValue(value)?.family);
        setRootVar('--song-font', value);
        setRootVar('--artist-font', value);
        this.requestFitSongText();
      },

      restoreCommittedFontPreview() {
        const selected = this.getFontOptionByValue(this.dom.selSongFont.value);
        if (!selected) return;
        this.previewFontValue(selected.value, selected.family);
      },

      setFontValue(value, { close = false } = {}) {
        const selected = this.getFontOptionByValue(value);
        if (!selected) return;
        this.dom.selSongFont.value = selected.value;
        this.updateTypography();
        this.updateFontPickerUI();
        if (close) this.closeFontMenu({ restore: false });
      },

      stepFont(direction) {
        const opts = this.getFontOptions();
        if (!opts.length) return;
        const current = this.getCurrentFontIndex();
        const next = (current + direction + opts.length) % opts.length;
        this.setFontValue(opts[next].value);
        if (this.isFontMenuOpen()) this.scrollActiveFontIntoView();
      },

      stepFontPrev() {
        this.stepFont(-1);
      },

      stepFontNext() {
        this.stepFont(1);
      },

      moveFontPreview(direction) {
        const opts = this.getFontOptions();
        if (!opts.length) return;
        const currentValue = this._fontPreviewValue || this.dom.selSongFont.value;
        const current = Math.max(0, opts.findIndex((item) => item.value === currentValue));
        const next = (current + direction + opts.length) % opts.length;
        const item = opts[next];
        this._fontPreviewValue = item.value;
        this.previewFontValue(item.value, item.family);
        this.updateFontOptionStates(item.value);
        this.scrollFontOptionIntoView(item.value);
      },

      scrollFontOptionIntoView(value) {
        const option = Array.from(this.dom.fontPickerMenu.querySelectorAll('.font-option'))
          .find((btn) => btn.dataset.value === value);
        if (option) option.scrollIntoView({ block: 'nearest' });
      },

      scrollActiveFontIntoView() {
        this.scrollFontOptionIntoView(this.dom.selSongFont.value);
      },

      updateFontOptionStates(previewValue = null) {
        if (!this.dom?.fontPickerMenu) return;
        const selectedValue = this.dom.selSongFont.value;
        this.dom.fontPickerMenu.querySelectorAll('.font-option').forEach((btn) => {
          const isActive = btn.dataset.value === selectedValue;
          const isPreview = !!previewValue && btn.dataset.value === previewValue && !isActive;
          btn.classList.toggle('is-active', isActive);
          btn.classList.toggle('is-preview', isPreview);
          btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
        });
      },

      updateFontPickerUI() {
        if (!this.dom?.fontPickerButton) return;
        const selected = this.getFontOptionByValue(this.dom.selSongFont.value);
        if (!selected) return;
        this.dom.fontPickerButton.textContent = `字体: ${selected.label}`;
        this.dom.fontPickerButton.style.fontFamily = selected.value;
        this.updateFontOptionStates();
      },

      setupEventListeners() {
        this.dom.bgInput.addEventListener('change', (e) => this.handleFile(e.target, this.dom.mainBg, false));
        this.dom.logoInput.addEventListener('change', (e) => this.handleFile(e.target, this.dom.logoImg, true));
        this.dom.mainBg.addEventListener('load', () => this.updateValidation());
        this.dom.mainBg.addEventListener('error', () => this.updateValidation());
        this.dom.logoImg.addEventListener('load', () => this.updateValidation());
        this.dom.logoImg.addEventListener('error', () => this.updateValidation());

        const onActivateByKeyboard = (e, handler) => {
          if (e.key !== 'Enter' && e.key !== ' ') return;
          e.preventDefault();
          handler();
        };

        document.querySelectorAll('.file-btn').forEach((el) => {
          el.addEventListener('keydown', (e) => {
            const input = el.querySelector('input[type="file"]');
            onActivateByKeyboard(e, () => {
              if (input) input.click();
              else el.click();
            });
          });
        });

        this.dom.logoBox.addEventListener('click', () => this.dom.logoInput.click());
        this.dom.logoBox.addEventListener('keydown', (e) => {
          onActivateByKeyboard(e, () => this.dom.logoInput.click());
        });

        this.dom.controls.addEventListener('click', (e) => {
          const btn = e.target.closest('button[data-action]');
          if (!btn) return;

          const action = btn.dataset.action;
          if (this.state.isExporting) return;

          if (action === 'exportPng') {
            Exporter.save('png');
            return;
          }

          if (action === 'exportJpg') {
            Exporter.save('jpg');
            return;
          }

          const fn = this[action];
          if (typeof fn !== 'function') return;

          try {
            fn.call(this);
            Telemetry.track('control_used', {
              action,
              exportTarget: this.state.exportTarget,
              layoutMode: this.state.layoutMode,
              hasLogo: this.state.hasLogo,
              hasShadow: this.state.hasShadow,
              font: getSelectedFontFamily(this.dom.selSongFont)
            });
            this.noteChanged();
          } catch (err) {
            Logger.error('Action failed:', action, err);
            Toast.show('操作失败：请重试该按钮，或刷新页面后再次操作。', 'error', 3500);
          }
        });

        this._onDocumentClick = (e) => {
          if (!this.dom?.fontPicker) return;
          if (this.dom.fontPicker.contains(e.target)) return;
          this.closeFontMenu({ restore: true });
        };
        document.addEventListener('click', this._onDocumentClick);

        this.dom.selPreset.addEventListener('change', (e) => this.applyPreset(e.target.value));
        this.dom.selSongFont.addEventListener('change', () => { this.updateTypography(); this.noteChanged(); });
        this.dom.rngSpace.addEventListener('input', () => { this.updateTypography(); this.noteChanged(); });
        this.dom.rngTitleSize.addEventListener('input', () => { this.updateTextScale(); this.noteChanged(); });
        this.dom.rngArtistSize.addEventListener('input', () => { this.updateArtistScale(); this.noteChanged(); });
        this.dom.rngMetaSize.addEventListener('input', () => { this.updateMetaScale(); this.noteChanged(); });
        [this.dom.rngBgZoom, this.dom.rngBgX, this.dom.rngBgY, this.dom.rngBgRot].forEach((el) => {
          el.addEventListener('input', () => { this.updateBackgroundCrop(); this.noteChanged(); });
        });
        this.dom.selLayerMode.addEventListener('change', (e) => { this.setLayerMode(e.target.value); this.noteChanged(); });
        this.dom.selExportTarget.addEventListener('change', (e) => { this.setExportTarget(e.target.value); this.noteChanged(); });
        this.dom.colorPicker.addEventListener('input', (e) => { this.setColor(e.target.value); this.noteChanged(); });

        this.dom.fontPickerButton.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (this.isFontMenuOpen()) this.moveFontPreview(1);
            else this.stepFont(1);
            return;
          }
          if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (this.isFontMenuOpen()) this.moveFontPreview(-1);
            else this.stepFont(-1);
            return;
          }
          if (e.key === 'Escape' && this.isFontMenuOpen()) {
            e.preventDefault();
            this.closeFontMenu({ restore: true });
          }
        });

        this.dom.fontPickerMenu.addEventListener('pointerover', (e) => {
          const option = e.target.closest('.font-option');
          if (!option) return;
          const value = option.dataset.value;
          const family = option.dataset.family;
          this._fontPreviewValue = value;
          this.previewFontValue(value, family);
          this.updateFontOptionStates(value);
        });
        this.dom.fontPickerMenu.addEventListener('pointerleave', () => {
          if (!this.isFontMenuOpen()) return;
          this._fontPreviewValue = null;
          this.restoreCommittedFontPreview();
          this.updateFontOptionStates();
        });
        this.dom.fontPickerMenu.addEventListener('click', (e) => {
          const option = e.target.closest('.font-option');
          if (!option) return;
          e.preventDefault();
          e.stopPropagation();
          this.setFontValue(option.dataset.value, { close: true });
          this.noteChanged();
        });
        this.dom.fontPickerMenu.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowDown') {
            e.preventDefault();
            this.moveFontPreview(1);
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            this.moveFontPreview(-1);
          } else if (e.key === 'Enter') {
            e.preventDefault();
            const value = this._fontPreviewValue || this.dom.selSongFont.value;
            this.setFontValue(value, { close: true });
            this.noteChanged();
          } else if (e.key === 'Escape') {
            e.preventDefault();
            this.closeFontMenu({ restore: true });
          }
        });

        this.attachEditableRefit(this.dom.songText, { isSong: true });
        this.attachEditableRefit(this.dom.artistText, { isSong: false });
        this.dom.topMeta.querySelectorAll('.meta-item').forEach((el) => {
          el.addEventListener('input', () => {
            sanitizeEditableText(el, true);
            this.noteChanged();
          });
          el.addEventListener('blur', () => {
            sanitizeEditableText(el, false);
            this.noteChanged();
          });
        });
      },

      attachEditableRefit(el, { isSong }) {
        let composing = false;

        const normalizeAndFit = (hardFit = false) => {
          sanitizeEditableText(el, !hardFit);
          if (isSong) this.updateCaseUI();
          if (hardFit) this.fitSongText();
          else this.requestFitSongText();
          this.noteChanged();
        };

        el.addEventListener('compositionstart', () => { composing = true; });
        el.addEventListener('compositionend', () => {
          composing = false;
          normalizeAndFit(false);
        });

        el.addEventListener('input', () => {
          if (composing) return;
          normalizeAndFit(false);
        });

        el.addEventListener('blur', () => normalizeAndFit(true));

        el.addEventListener('keydown', (e) => {
          if (e.key !== 'Enter') return;
          e.preventDefault();
          el.blur();
        });
      },

      setupPasteHandler() {
        document.querySelectorAll('[contenteditable]').forEach((el) => {
          el.addEventListener('paste', (e) => {
            e.preventDefault();

            const cd = e.clipboardData || window.clipboardData;
            if (!cd || typeof cd.getData !== 'function') return;

            const text = cd.getData('text/plain');
            const sel = window.getSelection();
            if (!sel || !sel.rangeCount) return;

            try {
              sel.deleteFromDocument();
              sel.getRangeAt(0).insertNode(document.createTextNode(text));
              sel.collapseToEnd();
            } catch (_) {}

            sanitizeEditableText(el, true);
            if (el.id === 'songText') this.updateCaseUI();
            if (el.id === 'songText' || el.id === 'artistText') this.requestFitSongText();
            this.noteChanged();
          });
        });
      },

      getMetaTexts() {
        return Array.from(this.dom.topMeta.querySelectorAll('.meta-item')).map((el) => el.textContent || '');
      },

      setMetaTexts(values) {
        const items = Array.from(this.dom.topMeta.querySelectorAll('.meta-item'));
        items.forEach((el, idx) => {
          if (typeof values?.[idx] === 'string') el.textContent = values[idx];
        });
      },

      getCurrentProject({ forStorage = false } = {}) {
        const skippedLargeAssets = [];
        const prepareAssetSrc = (src, label) => {
          const value = src || '';
          if (forStorage && isLargeDataUrlForAutosave(value)) {
            skippedLargeAssets.push(label);
            return '';
          }
          return value;
        };

        const project = {
          schemaVersion: 1,
          updatedAt: new Date().toISOString(),
          text: {
            artist: this.dom.artistText.textContent || '',
            song: this.dom.songText.textContent || '',
            meta: this.getMetaTexts()
          },
          controls: {
            fontValue: this.dom.selSongFont.value,
            fontFamily: getSelectedFontFamily(this.dom.selSongFont),
            letterSpacing: Number.parseFloat(this.dom.rngSpace.value) || 0,
            titleSizePercent: Number.parseInt(this.dom.rngTitleSize.value, 10) || 100,
            artistSizePercent: Number.parseInt(this.dom.rngArtistSize.value, 10) || 100,
            metaSizePercent: Number.parseInt(this.dom.rngMetaSize.value, 10) || 100,
            bgZoom: Number.parseInt(this.dom.rngBgZoom.value, 10) || 100,
            bgX: Number.parseInt(this.dom.rngBgX.value, 10) || 50,
            bgY: Number.parseInt(this.dom.rngBgY.value, 10) || 50,
            bgRot: Number.parseInt(this.dom.rngBgRot.value, 10) || 0,
            textColor: this.dom.colorPicker.value || '#ffffff',
            layoutMode: this.state.layoutMode,
            logoFilter: this.state.logoFilter,
            isBold: this.state.isBold,
            hasShadow: this.state.hasShadow,
            hasLogo: this.state.hasLogo,
            caseMode: this.state.caseMode,
            blendOn: this.state.blendOn,
            metaOn: this.state.metaOn,
            layerMode: this.state.layerMode,
            exportTarget: this.state.exportTarget,
            isBW: this.state.isBW,
            hasNoise: this.state.hasNoise,
            safeOn: this.state.safeOn
          },
          assets: {
            backgroundSrc: prepareAssetSrc(this.dom.mainBg.getAttribute('src'), '背景图'),
            logoSrc: this.state.hasLogo
              ? prepareAssetSrc(this.dom.logoImg.getAttribute('src'), 'Logo')
              : ''
          }
        };

        if (forStorage && skippedLargeAssets.length) {
          project.storageWarnings = { skippedLargeAssets };
        }

        return project;
      },

      restoreAutosave() {
        const project = safeJsonParse(localStorage.getItem(STORAGE_KEY), null);
        if (!project || typeof project !== 'object') return false;
        this.applyProject(project, { skipAutosave: true });
        Toast.show('已恢复上次自动保存。', 'ok', 1600);
        return true;
      },

      scheduleAutosave() {
        if (this._isApplyingProject || this.state.isExporting) return;
        if (this._autosaveTimer) clearTimeout(this._autosaveTimer);
        this._autosaveTimer = setTimeout(() => {
          this._autosaveTimer = null;
          this.saveAutosave();
        }, 250);
      },

      saveAutosave() {
        if (this._isApplyingProject) return;
        try {
          const project = this.getCurrentProject({ forStorage: true });
          localStorage.setItem(STORAGE_KEY, JSON.stringify(project));
          const skipped = project.storageWarnings?.skippedLargeAssets || [];
          if (skipped.length && !this._autosaveLargeAssetWarned) {
            this._autosaveLargeAssetWarned = true;
            Toast.show(`${skipped.join('、')}已载入并可导出；因文件较大，未写入自动保存。`, 'warn', 5200);
          }
        } catch (err) {
          Logger.warn('autosave failed:', err);
          Toast.show('自动保存失败，浏览器存储空间可能已满。', 'warn', 3000);
        }
      },

      noteChanged() {
        this.updateValidation();
        this.scheduleAutosave();
      },

      createDefaultProject() {
        return {
          text: {
            artist: '示例艺人',
            song: '示例标题',
            meta: ['openFAD', '示例项目', '2026']
          },
          controls: {
            fontValue: "'Inter', sans-serif",
            letterSpacing: -2,
            titleSizePercent: 100,
            artistSizePercent: 100,
            metaSizePercent: 100,
            bgZoom: 100,
            bgX: 50,
            bgY: 50,
            bgRot: 0,
            textColor: '#ffffff',
            layoutMode: 0,
            logoFilter: 0,
            isBold: true,
            hasShadow: false,
            hasLogo: true,
            caseMode: 0,
            blendOn: true,
            metaOn: true,
            layerMode: 'full',
            exportTarget: 'dsp-3840',
            isBW: false,
            hasNoise: false,
            safeOn: false
          },
          assets: {
            backgroundSrc: DEFAULT_BACKGROUND_SRC,
            logoSrc: DEFAULT_LOGO_SRC
          }
        };
      },

      applyPreset(value) {
        if (!value) return;
        const current = this.getCurrentProject();
        let presetProject = null;

        if (BUILT_IN_PRESETS[value]) {
          presetProject = BUILT_IN_PRESETS[value].project;
        } else if (value.startsWith('custom:')) {
          const name = value.slice('custom:'.length);
          presetProject = this.readCustomPresets()[name];
        }

        if (!presetProject) return;
        this.applyProject(mergeDeep(current, presetProject));
        Toast.show(`已载入预设: ${value.replace(/^builtin:|^custom:/, '')}`, 'ok', 1400);
        Telemetry.track('preset_selected', {
          presetType: BUILT_IN_PRESETS[value] ? 'built-in' : 'custom'
        });
      },

      updateTelemetryUI() {
        if (!this.dom?.btnTelemetry) return;
        const enabled = isTelemetryEnabled();
        this.dom.btnTelemetry.textContent = enabled ? '分析: 开' : '分析: 关';
        this.dom.btnTelemetry.classList.toggle('active', enabled);
        this.dom.btnTelemetry.setAttribute('aria-pressed', enabled ? 'true' : 'false');
      },

      toggleTelemetry() {
        const next = !isTelemetryEnabled();
        setTelemetryEnabled(next);
        this.updateTelemetryUI();
        Toast.show(next ? '使用分析已开启。' : '使用分析已关闭。', next ? 'ok' : 'warn', 1800);
      },

      updateExportStatus(message, tone = '') {
        if (!this.dom?.exportStatus) return;
        this.dom.exportStatus.textContent = message;
        this.dom.exportStatus.classList.toggle('ready', tone === 'ready');
        this.dom.exportStatus.classList.toggle('warn', tone === 'warn');
      },

      openDemoProject() {
        try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
        this.applyProject(this.createDefaultProject());
        if (this.dom.selPreset) this.dom.selPreset.value = 'builtin:openfad-right';
        this.updateExportStatus('导出状态: 示例已载入，可编辑后导出。', 'warn');
        Toast.show('已打开公开安全示例。', 'ok', 1800);
      },

      buildProjectExportPayload() {
        const project = this.getCurrentProject({ forStorage: true });
        const target = getExportTarget(this.state.exportTarget);
        return {
          ...project,
          app: {
            project: 'openFAD',
            tool: 'cover-machine',
            version: '0.1.0-draft',
            language: 'zh-CN',
            renderer: navigator.userAgent || 'unknown',
            html2canvas: window.html2canvas?.version || '1.4.1'
          },
          exportPlan: {
            target: {
              id: target.id,
              label: target.label,
              width: target.width,
              height: target.height,
              mime: target.mime
            },
            transparentLayer: this.state.layerMode,
            lastExportMode: this.state.lastExportMode
          },
          knownLimits: [
            '浏览器导出结果可能因渲染器和字体加载状态略有差异。',
            '如果浏览器拦截下载，请点击重试下载，或改用 Chrome / Edge 再次导出。',
            '示例 Logo 是 openFAD 占位素材，不授权使用 FAD Records 品牌资产。'
          ]
        };
      },

      downloadProjectJson() {
        const timestamp = new Date().toISOString().slice(0, 19).replace(/[T:.]/g, '-');
        const filename = `openfad-cover-project-${timestamp}.json`;
        const payload = this.buildProjectExportPayload();
        const result = downloadTextFile(JSON.stringify(payload, null, 2), filename);
        this.updateExportStatus(`项目 JSON 已发送: ${result.fileName} (${formatBytes(result.sizeBytes)})。`, 'ready');
        Toast.show('项目 JSON 下载请求已发送。', 'ok', 1800);
      },

      retryLastExport() {
        if (!this.state.lastExportMode) {
          this.updateExportStatus('导出状态: 暂无可重试的导出，请先导出一次。', 'warn');
          Toast.show('暂无可重试的导出。', 'warn', 1800);
          return;
        }
        Exporter.save(this.state.lastExportMode);
      },

      savePreset() {
        const rawName = window.prompt('预设名称', 'openFAD 自定义');
        if (rawName === null) return;
        const name = rawName.trim().replace(/\s+/g, ' ');
        if (!name) {
          Toast.show('预设未保存：名称为空。', 'warn', 2000);
          return;
        }

        const presets = this.readCustomPresets();
        const project = this.getCurrentProject({ forStorage: true });
        presets[name] = project;
        this.writeCustomPresets(presets);
        this.setupPresetMenus();
        this.dom.selPreset.value = `custom:${name}`;
        const skipped = project.storageWarnings?.skippedLargeAssets || [];
        Toast.show(skipped.length
          ? `预设已保存，但${skipped.join('、')}太大未写入预设。`
          : `预设已保存: ${name}`, skipped.length ? 'warn' : 'ok', 2600);
      },

      resetProject() {
        if (!window.confirm('重置会清除当前自动保存并恢复默认模板，继续吗？')) return;
        try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
        this.applyProject(this.createDefaultProject());
        Toast.show('已重置为 openFAD 默认模板。', 'ok', 1600);
      },

      applyProject(project, { skipAutosave = false } = {}) {
        if (!project || typeof project !== 'object') return;
        this._isApplyingProject = true;

        const controls = project.controls || {};
        const assets = project.assets || {};
        const text = project.text || {};

        if (typeof text.artist === 'string') this.dom.artistText.textContent = text.artist;
        if (typeof text.song === 'string') this.dom.songText.textContent = text.song;
        if (Array.isArray(text.meta)) this.setMetaTexts(text.meta);

        if (typeof controls.fontValue === 'string') {
          const hasFont = Array.from(this.dom.selSongFont.options).some((opt) => opt.value === controls.fontValue);
          if (hasFont) this.dom.selSongFont.value = controls.fontValue;
        }

        this.dom.rngSpace.value = String(clamp(controls.letterSpacing, -5, 10, -2));
        this.dom.rngTitleSize.value = String(clamp(controls.titleSizePercent, 60, 160, 100));
        this.dom.rngArtistSize.value = String(clamp(controls.artistSizePercent, 60, 160, 100));
        this.dom.rngMetaSize.value = String(clamp(controls.metaSizePercent, 60, 160, 100));
        this.dom.rngBgZoom.value = String(clamp(controls.bgZoom, 80, 180, 100));
        this.dom.rngBgX.value = String(clamp(controls.bgX, 0, 100, 50));
        this.dom.rngBgY.value = String(clamp(controls.bgY, 0, 100, 50));
        this.dom.rngBgRot.value = String(clamp(controls.bgRot, -20, 20, 0));
        this.dom.colorPicker.value = typeof controls.textColor === 'string' ? controls.textColor : '#ffffff';

        this.state.layoutMode = Number.isInteger(controls.layoutMode) ? controls.layoutMode : 0;
        this.state.logoFilter = Number.isInteger(controls.logoFilter) ? controls.logoFilter : 0;
        this.state.isBold = controls.isBold !== false;
        this.state.hasShadow = !!controls.hasShadow;
        const logoSrc = normalizeLogoSrc(assets.logoSrc);
        this.state.hasLogo = !!controls.hasLogo && !!logoSrc;
        this.state.caseMode = Number.isInteger(controls.caseMode) ? controls.caseMode : 0;
        this.state.blendOn = controls.blendOn !== false;
        this.state.metaOn = controls.metaOn !== false;
        this.state.layerMode = LAYER_MODES.has(controls.layerMode) ? controls.layerMode : 'full';
        this.state.exportTarget = getExportTarget(controls.exportTarget).id;
        this.state.isBW = !!controls.isBW;
        this.state.hasNoise = !!controls.hasNoise;
        this.state.safeOn = !!controls.safeOn;

        if (assets.backgroundSrc) this.dom.mainBg.src = assets.backgroundSrc;
        if (this.state.hasLogo && logoSrc) {
          this.dom.logoImg.src = logoSrc;
          this.dom.logoImg.style.display = 'block';
          this.dom.logoBox.classList.add('has-logo');
          this.dom.btnLogoColor.disabled = false;
        } else {
          this.clearLogo();
        }

        this.updateLayoutUI();
        this.updateLogoFilterUI();
        this.dom.layoutLayer.classList.toggle('shadow-on', this.state.hasShadow);
        this.dom.btnShadow.textContent = this.state.hasShadow ? '阴影: 开' : '阴影: 关';
        this.dom.btnShadow.classList.toggle('active', this.state.hasShadow);
        this.dom.bgLayer.classList.toggle('grayscale', this.state.isBW);
        this.dom.btnBW.classList.toggle('active', this.state.isBW);
        this.dom.texNoise.classList.toggle('active', this.state.hasNoise);
        this.dom.btnNoise.classList.toggle('active', this.state.hasNoise);
        this.dom.safeZone.classList.toggle('active', this.state.safeOn);
        this.dom.btnSafe.classList.toggle('active', this.state.safeOn);
        this.dom.btnBold.classList.toggle('active', this.state.isBold);
        setRootVar('--song-weight', this.state.isBold ? '800' : '400');
        setRootVar('--artist-weight', this.state.isBold ? '700' : '400');
        this.dom.topMeta.style.display = this.state.metaOn ? '' : 'none';
        this.dom.btnMeta.textContent = this.state.metaOn ? '发行信息: 开' : '发行信息: 关';
        this.dom.btnMeta.classList.toggle('active', this.state.metaOn);
        this.dom.selLayerMode.value = this.state.layerMode;
        this.setExportTarget(this.state.exportTarget);

        this.updateTypography();
        this.updateTextScale();
        this.updateArtistScale();
        this.updateMetaScale();
        this.updateBackgroundCrop();
        this.updateBlendUI();
        this.updateCaseUI();
        this.updateValidation();
        this.handleResize();
        this.fitSongText();

        this._isApplyingProject = false;
        if (!skipAutosave) this.scheduleAutosave();
      },

      handleFile(input, imgElement, isLogo) {
        const file = input?.files?.[0];
        if (!file) return;

        input.value = '';

        if (!file.type || !file.type.startsWith('image/')) {
          Toast.show('文件已拒绝：不是图片。', 'error');
          return;
        }

        const maxBytes = isLogo ? CONFIG.maxLogoFileBytes : CONFIG.maxBackgroundFileBytes;
        if (file.size > maxBytes) {
          const maxMb = Math.round(maxBytes / 1024 / 1024);
          Toast.show(`文件已拒绝：${isLogo ? 'Logo' : '背景图'}不能超过 ${maxMb}MB。`, 'error', 4200);
          return;
        }

        Logger.debug('load file start', { name: file.name, isLogo, size: file.size });

        const onOk = () => {
          imgElement.style.display = 'block';

          if (isLogo) {
            this.dom.logoBox.classList.add('has-logo');
            this.state.hasLogo = true;
            this.resetLogoState(imgElement);
            this.dom.btnLogoColor.disabled = false;
          }

          this.requestFitSongText();
          if (isLargeDataUrlForAutosave(imgElement.getAttribute('src') || '')) {
            this._autosaveLargeAssetWarned = true;
            Toast.show(`${isLogo ? 'Logo' : '背景图'}已载入并可导出；因文件较大，未写入自动保存。`, 'warn', 5200);
          }
          this.noteChanged();
          Logger.debug('load file success', { name: file.name, isLogo });
          Telemetry.track('image_loaded', {
            imageKind: isLogo ? 'logo' : 'background',
            mime: file.type,
            sizeBytes: file.size,
            width: imgElement.naturalWidth,
            height: imgElement.naturalHeight
          });
        };

        const onFail = () => {
          if (isLogo) this.clearLogo();
          Toast.show('图片载入失败：文件损坏或格式不受支持。', 'error');
          Logger.warn('load file failed', { name: file.name, isLogo });
        };

        setImgFromFile(imgElement, file, { onOk, onFail });
      },

      clearLogo() {
        this.state.hasLogo = false;
        this.state.logoFilter = 0;

        this.dom.logoBox.classList.remove('has-logo');
        revokeImgUrl(this.dom.logoImg);

        this.dom.logoImg.removeAttribute('src');
        this.dom.logoImg.style.display = 'none';
        this.dom.logoImg.classList.remove('filter-white', 'filter-black');

        this.dom.btnLogoColor.disabled = true;
        this.dom.btnLogoColor.textContent = 'Logo: 原色';
      },

      resetLogoState(img) {
        this.state.logoFilter = 0;
        img.classList.remove('filter-white', 'filter-black');
        this.dom.btnLogoColor.textContent = 'Logo: 原色';
      },

      updateLogoFilterUI() {
        const img = this.dom.logoImg;
        const btn = this.dom.btnLogoColor;

        img.classList.remove('filter-white', 'filter-black');
        if (!this.state.hasLogo) {
          btn.disabled = true;
          btn.textContent = 'Logo: 原色';
          return;
        }

        btn.disabled = false;
        if (this.state.logoFilter === 1) {
          img.classList.add('filter-white');
          btn.textContent = 'Logo: 白';
        } else if (this.state.logoFilter === 2) {
          img.classList.add('filter-black');
          btn.textContent = 'Logo: 黑';
        } else {
          this.state.logoFilter = 0;
          btn.textContent = 'Logo: 原色';
        }
      },

      toggleLogoFilter() {
        if (!this.state.hasLogo) return;

        this.state.logoFilter = (this.state.logoFilter + 1) % 3;
        this.updateLogoFilterUI();
      },

      toggleShadow() {
        this.state.hasShadow = !this.state.hasShadow;
        this.dom.layoutLayer.classList.toggle('shadow-on', this.state.hasShadow);
        this.dom.btnShadow.textContent = this.state.hasShadow ? '阴影: 开' : '阴影: 关';
        this.dom.btnShadow.classList.toggle('active', this.state.hasShadow);
      },

      toggleBlend() {
        this.state.blendOn = !this.state.blendOn;
        this.updateBlendUI();
      },

      updateBlendUI() {
        if (this.state.blendOn) {
          setRootVar('--meta-blend', 'exclusion');
          setRootVar('--meta-opacity', '0.9');
          this.dom.btnBlend.textContent = '混合: 开';
          this.dom.btnBlend.classList.add('active');
        } else {
          setRootVar('--meta-blend', 'normal');
          setRootVar('--meta-opacity', '1');
          this.dom.btnBlend.textContent = '混合: 关';
          this.dom.btnBlend.classList.remove('active');
        }
      },

      toggleMeta() {
        this.state.metaOn = !this.state.metaOn;
        this.dom.topMeta.style.display = this.state.metaOn ? '' : 'none';
        this.dom.btnMeta.textContent = this.state.metaOn ? '发行信息: 开' : '发行信息: 关';
        this.dom.btnMeta.classList.toggle('active', this.state.metaOn);
      },

      toggleBW() {
        this.state.isBW = !this.state.isBW;
        this.dom.bgLayer.classList.toggle('grayscale', this.state.isBW);
        this.dom.btnBW.classList.toggle('active', this.state.isBW);
      },

      toggleNoise() {
        this.state.hasNoise = !this.state.hasNoise;
        this.dom.texNoise.classList.toggle('active', this.state.hasNoise);
        this.dom.btnNoise.classList.toggle('active', this.state.hasNoise);
      },

      toggleSafe() {
        this.state.safeOn = !this.state.safeOn;
        this.dom.safeZone.classList.toggle('active', this.state.safeOn);
        this.dom.btnSafe.classList.toggle('active', this.state.safeOn);
      },

      updateTypography() {
        const font = this.dom.selSongFont.value;
        const space = this.dom.rngSpace.value;
        const family = getSelectedFontFamily(this.dom.selSongFont);

        ensureFont(family);
        setRootVar('--song-font', font);
        setRootVar('--artist-font', font);
        setRootVar('--song-spacing', `${space}px`);

        this.updateFontPickerUI();
        this.requestFitSongText();
      },

      updateTextScale() {
        const raw = Number.parseInt(this.dom.rngTitleSize.value, 10);
        const percent = Number.isFinite(raw) ? raw : 100;
        const scale = Math.max(0.6, Math.min(1.6, percent / 100));

        this.state.titleScale = scale;
        if (this.dom.titleSizeValue) this.dom.titleSizeValue.textContent = `标题 ${percent}%`;

        this.requestFitSongText();
      },

      updateArtistScale() {
        const raw = Number.parseInt(this.dom.rngArtistSize.value, 10);
        const percent = Number.isFinite(raw) ? raw : 100;
        const scale = Math.max(0.6, Math.min(1.6, percent / 100));
        const artistSize = Math.max(18, Math.round(CONFIG.artistBase * scale));

        this.state.artistScale = scale;
        setRootVar('--artist-size', `${artistSize}px`);
        if (this.dom.artistSizeValue) this.dom.artistSizeValue.textContent = `艺人 ${percent}%`;

        this.requestFitSongText();
      },

      updateMetaScale() {
        const raw = Number.parseInt(this.dom.rngMetaSize.value, 10);
        const percent = Number.isFinite(raw) ? raw : 100;
        const scale = Math.max(0.6, Math.min(1.6, percent / 100));
        const metaSize = Math.max(9, Math.round(14 * scale));

        this.state.metaScale = scale;
        setRootVar('--meta-size', `${metaSize}px`);
        if (this.dom.metaSizeValue) this.dom.metaSizeValue.textContent = `信息 ${percent}%`;

        this.handleResize();
      },

      updateBackgroundCrop() {
        const zoom = clamp(this.dom.rngBgZoom.value, 80, 180, 100);
        const x = clamp(this.dom.rngBgX.value, 0, 100, 50);
        const y = clamp(this.dom.rngBgY.value, 0, 100, 50);
        const rot = clamp(this.dom.rngBgRot.value, -20, 20, 0);

        this.state.bgZoom = zoom / 100;
        this.state.bgX = x;
        this.state.bgY = y;
        this.state.bgRot = rot;

        setRootVar('--bg-zoom', String(this.state.bgZoom));
        setRootVar('--bg-x', `${x}%`);
        setRootVar('--bg-y', `${y}%`);
        setRootVar('--bg-rot', `${rot}deg`);

        if (this.dom.bgZoomValue) this.dom.bgZoomValue.textContent = `背景 ${Math.round(zoom)}%`;
        if (this.dom.bgXValue) this.dom.bgXValue.textContent = `X ${Math.round(x)}%`;
        if (this.dom.bgYValue) this.dom.bgYValue.textContent = `Y ${Math.round(y)}%`;
        if (this.dom.bgRotValue) this.dom.bgRotValue.textContent = `旋转 ${Math.round(rot)}`;
      },

      toggleBold() {
        this.state.isBold = !this.state.isBold;
        setRootVar('--song-weight', this.state.isBold ? '800' : '400');
        setRootVar('--artist-weight', this.state.isBold ? '700' : '400');
        this.dom.btnBold.classList.toggle('active', this.state.isBold);
        this.requestFitSongText();
      },

      setColor(hex) {
        setRootVar('--text-color', hex);
      },

      cycleLayout() {
        this.state.layoutMode = (this.state.layoutMode + 1) % 3;
        this.updateLayoutUI();
        this.requestFitSongText();
      },

      updateLayoutUI() {
        const container = this.dom.layoutContainer;
        container.classList.remove('layout-left', 'layout-center');

        if (this.state.layoutMode === 0) {
          this.dom.btnLayout.textContent = '位置: 右侧';
        } else if (this.state.layoutMode === 1) {
          container.classList.add('layout-left');
          this.dom.btnLayout.textContent = '位置: 左侧';
        } else {
          container.classList.add('layout-center');
          this.dom.btnLayout.textContent = '位置: 居中';
        }
      },

      toggleCase() {
        this.state.caseMode = (this.state.caseMode + 1) % 3;
        this.updateCaseUI();
        this.requestFitSongText();
      },

      updateCaseUI() {
        const btn = this.dom.btnCase;
        const text = this.dom.songText.textContent || '';
        const hasLatin = /[A-Za-z]/.test(text);

        btn.disabled = !hasLatin;
        if (!hasLatin) {
          setRootVar('--song-transform', 'none');
          btn.textContent = '大小写: 不适用';
          return;
        }

        if (this.state.caseMode === 0) setRootVar('--song-transform', 'uppercase');
        else if (this.state.caseMode === 1) setRootVar('--song-transform', 'none');
        else setRootVar('--song-transform', 'lowercase');

        btn.textContent = CASE_LABELS[this.state.caseMode] || CASE_LABELS[0];
      },

      setLayerMode(mode) {
        this.state.layerMode = LAYER_MODES.has(mode) ? mode : 'full';
      },

      setExportTarget(targetId = DEFAULT_EXPORT_TARGET.id) {
        const target = getExportTarget(targetId);
        this.state.exportTarget = target.id;
        if (this.dom.selExportTarget) this.dom.selExportTarget.value = target.id;
        if (this.dom.saveBtnJpg) this.dom.saveBtnJpg.textContent = target.buttonLabel;
        this.updateValidation();
      },

      updateValidation() {
        if (!this.dom?.validationPanel) return;

        const warnings = [];
        const target = getExportTarget(this.state.exportTarget);
        const title = (this.dom.songText.textContent || '').trim();
        const artist = (this.dom.artistText.textContent || '').trim();
        const bg = this.dom.mainBg;

        if (!artist) warnings.push('缺少艺人名称');
        if (!title) warnings.push('缺少作品标题');
        if (!bg.complete || bg.naturalWidth <= 0) {
          warnings.push('背景未载入');
        } else if (target.width >= 3000 && Math.min(bg.naturalWidth, bg.naturalHeight) < 1400) {
          warnings.push(`背景源尺寸为 ${bg.naturalWidth}x${bg.naturalHeight}`);
        }
        if (this.dom.songText.scrollWidth > Math.ceil(this.dom.textGroup.clientWidth)) warnings.push('标题宽度溢出');
        if (target.width !== target.height) warnings.push(`${target.label} 会使用居中的方形封面源`);

        const status = warnings.length
          ? `导出检查 WARN: ${target.label}: ${warnings.join('; ')}`
          : `导出检查 READY: ${target.label}`;

        this.dom.validationPanel.textContent = status;
        this.dom.validationPanel.classList.toggle('ready', warnings.length === 0);
        this.dom.validationPanel.classList.toggle('warn', warnings.length > 0);
      },

      handleResize() {
        const controlsH = this.dom.controls.offsetHeight;
        this.dom.previewWrapper.style.marginTop = `${controlsH}px`;
        this.dom.previewWrapper.style.height = `calc(100vh - ${controlsH}px)`;

        const baseSize = getBaseSizePx();
        const wrapper = this.dom.previewWrapper;

        const scale = Math.max(0.2, Math.min(
          (wrapper.clientWidth - 80) / baseSize,
          (wrapper.clientHeight - 80) / baseSize
        ));

        this.dom.artworkCanvas.style.willChange = 'transform';
        this.dom.artworkCanvas.style.transform = `translateZ(0) scale(${scale})`;

        if (this._willChangeTimer) clearTimeout(this._willChangeTimer);
        this._willChangeTimer = setTimeout(() => {
          this.dom.artworkCanvas.style.willChange = 'auto';
          this._willChangeTimer = null;
        }, 250);
      },

      requestFitSongText() {
        if (this._fitRaf) cancelAnimationFrame(this._fitRaf);
        this._fitRaf = requestAnimationFrame(() => {
          this._fitRaf = null;
          this.fitSongText();
        });
      },

      fitSongText() {
        const song = this.dom.songText;
        const group = this.dom.textGroup;
        const text = (song.textContent || '').trim();
        if (!text) return;

        const scale = Number.isFinite(this.state.titleScale) ? this.state.titleScale : 1;
        const maxFont = Math.max(CONFIG.songFloor, Math.round(CONFIG.songMax * scale));
        const minFont = Math.max(
          CONFIG.songFloor,
          Math.min(maxFont, Math.round(CONFIG.songMin * Math.min(scale, 1)))
        );
        song.style.setProperty('--song-size', `${maxFont}px`);

        const maxWidth = Math.max(1, group.clientWidth);
        const canvasH = Math.max(1, this.dom.artworkCanvas.clientHeight || getBaseSizePx());
        const maxHeight = Math.max(CONFIG.minSongBlockHeight, Math.floor(canvasH * CONFIG.songHeightRatio));

        let lo = minFont;
        let hi = maxFont;
        let best = minFont;

        while (lo <= hi) {
          const mid = Math.floor((lo + hi) / 2);
          song.style.setProperty('--song-size', `${mid}px`);

          const wOk = song.scrollWidth <= maxWidth;
          const hOk = song.scrollHeight <= maxHeight;

          if (wOk && hOk) {
            best = mid;
            lo = mid + 1;
          } else {
            hi = mid - 1;
          }
        }

        song.style.setProperty('--song-size', `${best}px`);
        while (
          best > minFont &&
          (song.scrollWidth > maxWidth || song.scrollHeight > maxHeight)
        ) {
          best -= 1;
          song.style.setProperty('--song-size', `${best}px`);
        }
      }
    };

    const Exporter = {
      _restoreTimer: null,

      setExportUiState({ activeBtn, activeText, activeDisabled, lockAll }) {
        if (App.dom?.saveBtnPng) {
          if (activeBtn === App.dom.saveBtnPng && typeof activeText === 'string') App.dom.saveBtnPng.textContent = activeText;
          if (activeBtn === App.dom.saveBtnPng) App.dom.saveBtnPng.disabled = !!activeDisabled;
        }

        if (App.dom?.saveBtnJpg) {
          if (activeBtn === App.dom.saveBtnJpg && typeof activeText === 'string') App.dom.saveBtnJpg.textContent = activeText;
          if (activeBtn === App.dom.saveBtnJpg) App.dom.saveBtnJpg.disabled = !!activeDisabled;
        }

        if (lockAll) {
          setButtonsDisabled([App.dom.saveBtnPng, App.dom.saveBtnJpg], true);
        }
      },

      beginExport(btn, originalText) {
        App.state.isExporting = true;
        document.body.classList.add('is-exporting');
        document.body.setAttribute('aria-busy', 'true');

        if (this._restoreTimer) {
          clearTimeout(this._restoreTimer);
          this._restoreTimer = null;
        }

        this.setExportUiState({ activeBtn: btn, activeText: '导出中...', activeDisabled: true, lockAll: true });
        App.updateExportStatus('导出状态: 正在渲染，请保持此页面打开。', 'warn');
        return () => {
          document.body.classList.remove('is-exporting');
          document.body.removeAttribute('aria-busy');
          App.state.isExporting = false;

          this._restoreTimer = setTimeout(() => {
            if (btn) btn.textContent = originalText;
            setButtonsDisabled([App.dom.saveBtnPng, App.dom.saveBtnJpg], false);
            this._restoreTimer = null;
          }, 1200);
        };
      },

      fitCanvasToTarget(canvas, target, backgroundColor) {
        if (!target || target.width === target.height) return canvas;

        const out = document.createElement('canvas');
        out.width = target.width;
        out.height = target.height;
        const ctx = out.getContext('2d');
        ctx.fillStyle = backgroundColor && backgroundColor !== 'transparent' ? backgroundColor : '#000000';
        ctx.fillRect(0, 0, out.width, out.height);

        const scale = Math.min(out.width / canvas.width, out.height / canvas.height);
        const w = Math.round(canvas.width * scale);
        const h = Math.round(canvas.height * scale);
        const x = Math.round((out.width - w) / 2);
        const y = Math.round((out.height - h) / 2);
        ctx.drawImage(canvas, x, y, w, h);
        return out;
      },

      async save(mode) {
        const isPng = mode === 'png';
        const btn = isPng ? App.dom.saveBtnPng : App.dom.saveBtnJpg;
        const originalText = btn.textContent;
        const element = App.dom.artworkCanvas;
        const isSafari = isSafariBrowser();
        const isFirefox = isFirefoxBrowser();

        if (App.state.isExporting) {
          Toast.show('正在导出，请稍等。', 'warn', 1800);
          return;
        }

        App.state.lastExportMode = mode;
        if (App.dom?.btnRetryExport) App.dom.btnRetryExport.disabled = false;
        const endExport = this.beginExport(btn, originalText);

        try {
          if (window.OPENFAD_HTML2CANVAS_READY) {
            await Promise.race([
              window.OPENFAD_HTML2CANVAS_READY,
              sleep(CONFIG.html2canvasWaitTimeoutMs)
            ]);
          }

          if (typeof window.html2canvas !== 'function') {
            throw new Error('html2canvas 未载入，请刷新页面后重试。');
          }

          const family = getSelectedFontFamily(App.dom.selSongFont);
          ensureFont(family);
          await FontManager.waitForFont(family);
          await FontManager.waitAll();

          const imgStates = await waitForImages(element);
          const imgOkMap = new Map(imgStates.map((x) => [x.img, x.ok]));

          const bgOk = imgOkMap.has(App.dom.mainBg)
            ? imgOkMap.get(App.dom.mainBg)
            : (App.dom.mainBg.complete && App.dom.mainBg.naturalWidth > 0);

          if (!isPng && !bgOk) {
            throw new Error('背景图未成功载入，无法导出 JPG。');
          }

          if (App.state.hasLogo) {
            const logoOk = imgOkMap.has(App.dom.logoImg)
              ? imgOkMap.get(App.dom.logoImg)
              : (App.dom.logoImg.complete && App.dom.logoImg.naturalWidth > 0);

            if (!logoOk) {
              throw new Error('Logo 未成功载入，无法带 logo 导出。');
            }

            if (typeof App.dom.logoImg.decode === 'function') {
              try {
                await Promise.race([
                  App.dom.logoImg.decode(),
                  sleep(1200)
                ]);
              } catch (_) {}
            }
          }

          App.fitSongText();
          await waitFrames((isSafari || isFirefox) ? 3 : 1);

          // Pre-render logo to data URL (html2canvas cannot access blob: URLs in cloned doc)
          // Safari fallback: skip pre-render replacement to avoid cloned-image race/missing render.
          let logoPreRenderUrl = null;
          let logoPreRenderPadding = 0;
          const useLogoPreRender = !isSafari;
          if (useLogoPreRender && App.state.hasLogo && App.dom.logoImg.complete && App.dom.logoImg.naturalWidth > 0) {
            try {
              const nw = App.dom.logoImg.naturalWidth;
              const nh = App.dom.logoImg.naturalHeight;
              logoPreRenderPadding = App.state.hasShadow ? Math.ceil(Math.max(nw, nh) * 0.25) : 0;
              const cw = nw + logoPreRenderPadding * 2;
              const ch = nh + logoPreRenderPadding * 2;
              const offscreen = document.createElement('canvas');
              offscreen.width = cw;
              offscreen.height = ch;
              const octx = offscreen.getContext('2d');

              let drawSrc = App.dom.logoImg;
              if (App.state.logoFilter !== 0) {
                const tmp = document.createElement('canvas');
                tmp.width = nw; tmp.height = nh;
                const tc = tmp.getContext('2d');
                tc.drawImage(App.dom.logoImg, 0, 0);
                tc.globalCompositeOperation = 'source-in';
                tc.fillStyle = App.state.logoFilter === 1 ? '#ffffff' : '#000000';
                tc.fillRect(0, 0, nw, nh);
                drawSrc = tmp;
              }

              if (App.state.hasShadow) {
                octx.shadowOffsetX = 0;
                octx.shadowColor = 'rgba(0,0,0,0.4)';
                octx.shadowBlur = 100; octx.shadowOffsetY = 30;
                octx.drawImage(drawSrc, logoPreRenderPadding, logoPreRenderPadding);
                octx.shadowColor = 'rgba(0,0,0,0.5)';
                octx.shadowBlur = 40; octx.shadowOffsetY = 10;
                octx.drawImage(drawSrc, logoPreRenderPadding, logoPreRenderPadding);
                octx.shadowColor = 'rgba(0,0,0,0.8)';
                octx.shadowBlur = 10; octx.shadowOffsetY = 4;
                octx.drawImage(drawSrc, logoPreRenderPadding, logoPreRenderPadding);
                octx.shadowColor = 'transparent';
                octx.shadowBlur = 0; octx.shadowOffsetY = 0;
              }
              octx.drawImage(drawSrc, logoPreRenderPadding, logoPreRenderPadding);
              logoPreRenderUrl = offscreen.toDataURL('image/png');
            } catch (e) {
              Logger.warn('Logo pre-render failed:', e);
            }
          }

          const selectedTarget = getExportTarget(App.state.exportTarget);
          Telemetry.track('export_started', {
            format: isPng ? 'png' : 'jpg',
            mode: App.state.layerMode,
            exportTarget: selectedTarget.id,
            hasLogo: App.state.hasLogo,
            hasShadow: App.state.hasShadow,
            font: getSelectedFontFamily(App.dom.selSongFont)
          });
          const targetSize = isPng ? CONFIG.exportSize : selectedTarget.width;
          const elementSize = getBaseSizePx();
          const exactScale = targetSize / elementSize;
          if (!Number.isFinite(exactScale) || exactScale <= 0) {
            throw new Error('导出比例计算失败。');
          }

          const layerMode = App.state.layerMode;
          const computedBg = getComputedStyle(element).backgroundColor || '#000';
          const bgForExport = isPng ? null : (computedBg === 'transparent' ? '#000' : computedBg);

          Logger.info('Export start', { mode, scale: exactScale, size: elementSize, layerMode, target: selectedTarget.id });

          const renderCanvas = () => html2canvas(element, {
            scale: exactScale,
            width: elementSize,
            height: elementSize,
            useCORS: true,
            allowTaint: false,
            backgroundColor: bgForExport,
            logging: false,
            imageTimeout: CONFIG.imageWaitTimeoutMs,
            onclone: (clonedDoc) => {
              try {
                const clonedCanvas = clonedDoc.getElementById('artwork-canvas');
                if (clonedCanvas) {
                  clonedCanvas.style.transform = 'none';
                  clonedCanvas.style.boxShadow = 'none';
                }

                const clonedBg = clonedDoc.getElementById('bgLayer');
                const clonedNoise = clonedDoc.getElementById('texNoise');
                const clonedMeta = clonedDoc.getElementById('topMeta');
                const clonedTextGroup = clonedDoc.getElementById('textGroup');
                const clonedArtist = clonedDoc.getElementById('artistText');
                const clonedSong = clonedDoc.getElementById('songText');
                const clonedLogoBox = clonedDoc.getElementById('logoBox');
                const clonedLayoutLayer = clonedDoc.getElementById('layoutLayer');
                const clonedLogoImg = clonedDoc.getElementById('logo-img');

                if (clonedLayoutLayer) {
                  clonedLayoutLayer.classList.toggle('shadow-on', App.state.hasShadow);
                }

                // Replace logo with pre-rendered data URL (blob: URLs are inaccessible in cloned doc)
                if (logoPreRenderUrl && clonedLogoImg) {
                  clonedLogoImg.src = logoPreRenderUrl;
                  clonedLogoImg.style.filter = 'none';
                  clonedLogoImg.className = '';
                  if (logoPreRenderPadding > 0 && clonedLogoBox) {
                    const origW = App.dom.logoImg.offsetWidth || 140;
                    const nw = App.dom.logoImg.naturalWidth || 1;
                    const displayPad = Math.round(logoPreRenderPadding * (origW / nw));
                    clonedLogoImg.style.width = (origW + displayPad * 2) + 'px';
                    clonedLogoImg.style.maxWidth = 'none';
                    clonedLogoImg.style.maxHeight = 'none';
                    clonedLogoImg.style.margin = -displayPad + 'px';
                    clonedLogoBox.style.overflow = 'visible';
                  }
                }

                // Export safety: force logo visible in cloned DOM when logo is enabled.
                if (App.state.hasLogo && clonedLogoBox && clonedLogoImg) {
                  clonedLogoBox.classList.add('has-logo');
                  clonedLogoBox.style.display = 'flex';
                  clonedLogoImg.style.display = 'block';
                  clonedLogoImg.style.opacity = '1';

                  if (!clonedLogoImg.src && App.dom.logoImg.src) {
                    clonedLogoImg.src = App.dom.logoImg.src;
                  }
                }

                if (App.state.hasShadow) {
                  const shadowText = '0 2px 5px rgba(0,0,0,0.8), 0 5px 20px rgba(0,0,0,0.5), 0 15px 50px rgba(0,0,0,0.4)';
                  if (clonedArtist) clonedArtist.style.textShadow = shadowText;
                  if (clonedSong) {
                    clonedSong.style.textShadow = shadowText;
                    clonedSong.style.overflow = 'visible';
                  }
                  if (clonedMeta) clonedMeta.style.textShadow = shadowText;
                } else {
                  if (clonedArtist) clonedArtist.style.textShadow = 'none';
                  if (clonedSong) {
                    clonedSong.style.textShadow = 'none';
                    clonedSong.style.overflow = '';
                  }
                  if (clonedMeta) clonedMeta.style.textShadow = 'none';
                }

                if (clonedMeta) {
                  if (!App.state.metaOn) {
                    clonedMeta.style.display = 'none';
                  } else if (isPng) {
                    clonedMeta.style.mixBlendMode = 'normal';
                    clonedMeta.style.opacity = '1';
                  } else if (App.state.blendOn) {
                    clonedMeta.style.mixBlendMode = 'exclusion';
                    clonedMeta.style.opacity = '0.9';
                  } else {
                    clonedMeta.style.mixBlendMode = 'normal';
                    clonedMeta.style.opacity = '1';
                  }
                }

                if (!isPng) return;

                if (clonedCanvas) clonedCanvas.style.backgroundColor = 'transparent';
                if (clonedBg) clonedBg.style.display = 'none';
                if (clonedNoise) clonedNoise.style.display = 'none';

                if (clonedLogoBox && !App.state.hasLogo) {
                  clonedLogoBox.style.display = 'none';
                }

                if (layerMode === 'text') {
                  if (clonedMeta) clonedMeta.style.display = 'none';
                } else if (layerMode === 'meta') {
                  if (clonedTextGroup) clonedTextGroup.style.display = 'none';
                  if (clonedLogoBox) clonedLogoBox.style.display = 'none';
                }
              } catch (err) {
                Logger.warn('onclone failed:', err);
              }
            }
          });

          const shouldRetryCapture = App.state.hasLogo && (isSafari || isFirefox);
          let canvas;
          try {
            canvas = await renderCanvas();
          } catch (firstErr) {
            if (!shouldRetryCapture) throw firstErr;
            Logger.warn('Export capture retrying once:', firstErr);
            await sleep(250);
            await waitFrames(2);
            canvas = await renderCanvas();
          }

          if (!isPng) {
            canvas = this.fitCanvasToTarget(canvas, selectedTarget, bgForExport);
          }

          const timestamp = new Date().toISOString().slice(0, 19).replace(/[T:.]/g, '-');
          let filename;
          let downloadResult;

          if (isPng) {
            filename = `openfad-cover-layer-${App.state.layerMode}-${timestamp}.png`;
            downloadResult = await downloadCanvas(canvas, filename, 'image/png');
          } else {
            filename = `openfad-cover-${selectedTarget.id}-${timestamp}.jpg`;
            downloadResult = await downloadCanvas(canvas, filename, selectedTarget.mime, selectedTarget.quality);
          }

          btn.textContent = '完成';
          btn.disabled = true;
          App.updateExportStatus(
            `导出完成: ${downloadResult.fileName} / ${canvas.width}x${canvas.height} / ${formatBytes(downloadResult.sizeBytes)} / 保存请求: 已发送。`,
            'ready'
          );
          Toast.show('导出完成。若浏览器没有保存文件，请点击“重试下载”。', 'ok', 2600);
          Telemetry.track('export_completed', {
            format: isPng ? 'png' : 'jpg',
            mode: App.state.layerMode,
            exportTarget: selectedTarget.id,
            width: canvas.width,
            height: canvas.height,
            hasLogo: App.state.hasLogo,
            hasShadow: App.state.hasShadow,
            font: getSelectedFontFamily(App.dom.selSongFont)
          });
        } catch (err) {
          Logger.error('Export Failed:', err);
          btn.textContent = '错误';
          btn.disabled = true;
          const userMessage = toUserErrorMessage(err);
          App.updateExportStatus(
            `导出失败: ${userMessage} 请点击“重试下载”，或改用 Chrome / Edge 后再次导出。`,
            'warn'
          );
          Toast.show(`导出失败: ${userMessage}\n请点击“重试下载”，或改用 Chrome / Edge 后再次导出。`, 'error', 5600);
          const failedTarget = getExportTarget(App.state.exportTarget);
          Telemetry.track('export_failed', {
            format: isPng ? 'png' : 'jpg',
            mode: App.state.layerMode,
            exportTarget: failedTarget.id,
            hasLogo: App.state.hasLogo,
            hasShadow: App.state.hasShadow,
            font: getSelectedFontFamily(App.dom.selSongFont)
          });
        } finally {
          endExport();
        }
      }
    };

    App.init();
  </script>
</body>
</html>

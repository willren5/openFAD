<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>openFAD Cover Machine｜中文开源封面制作器</title>

  <!-- Base font only (others are loaded on-demand) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Pin html2canvas version; load local first so file:// exports do not depend on CDN access. -->
  <script>
    window.OPENFAD_HTML2CANVAS_READY = (() => {
      const sources = [
        './vendor/html2canvas.min.js',
        'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'
      ];
      let index = 0;

      return new Promise((resolve) => {
        const loadNext = () => {
          if (typeof window.html2canvas === 'function') {
            resolve(true);
            return;
          }

          const src = sources[index];
          index += 1;
          if (!src) {
            resolve(false);
            return;
          }

          const script = document.createElement('script');
          script.src = src;
          if (/^https?:/i.test(src)) script.crossOrigin = 'anonymous';
          script.onload = () => resolve(typeof window.html2canvas === 'function');
          script.onerror = loadNext;
          document.head.appendChild(script);
        };

        loadNext();
      });
    })();
  </script>

  <style>
    :root {
      --base-size: 1000px;
      --bg-color: #0a0a0a;
      --text-color: #ffffff;

      --artist-font: 'Inter', sans-serif;
      --song-font: 'Inter', sans-serif;

      --artist-weight: 400;
      --song-weight: 800;
      --artist-size: 32px;
      --meta-size: 14px;

      --song-spacing: -2px;
      --layout-padding: 60px;
      --bg-x: 50%;
      --bg-y: 50%;
      --bg-zoom: 1;
      --bg-rot: 0deg;

      /* case control */
      --song-transform: uppercase;

      /* blend control (top meta only) */
      --meta-blend: exclusion;
      --meta-opacity: 0.9;
    }

    body {
      background-color: #111;
      font-family: 'Inter', sans-serif;
      margin: 0;
      overflow: hidden;
      height: 100vh;
      color: #888;
    }

    /* Export lock */
    body.is-exporting .controls {
      opacity: 0.82;
      filter: grayscale(0.25);
    }

    /* --- Controls --- */
    .controls {
      position: fixed;
      top: 0; left: 0; width: 100%;
      box-sizing: border-box;
      padding: 10px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .control-group {
      display: flex;
      gap: 4px;
      align-items: center;
      border-right: 1px solid #444;
      padding-right: 8px;
      margin-right: 4px;
    }
    .control-group:last-child { border: none; }

    .start-mode {
      flex: 1 1 100%;
      display: grid;
      grid-template-columns: minmax(260px, 1fr) minmax(360px, 1.2fr);
      gap: 10px 14px;
      align-items: center;
      width: 100%;
      max-width: 1320px;
    }

    .start-actions {
      justify-content: flex-end;
      border-right: 0;
      padding-right: 0;
      margin-right: 0;
      flex-wrap: wrap;
    }

    .start-status {
      grid-column: 1 / -1;
      display: flex;
      gap: 8px;
      align-items: stretch;
      justify-content: center;
      flex-wrap: wrap;
    }

    .pro-mode {
      flex: 1 1 100%;
      width: 100%;
      max-width: 1320px;
      border-top: 1px solid #303030;
      padding-top: 7px;
    }

    .pro-mode summary {
      width: fit-content;
      min-height: 30px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      border: 1px solid #444;
      border-radius: 4px;
      background: #242424;
      color: #eee;
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
      list-style: none;
      user-select: none;
    }

    .pro-mode summary::-webkit-details-marker { display: none; }
    .pro-mode summary::after {
      content: "+";
      color: #aaa;
      font-size: 14px;
    }
    .pro-mode[open] summary::after { content: "-"; }

    .pro-grid {
      display: flex;
      gap: 6px;
      align-items: stretch;
      flex-wrap: wrap;
      padding-top: 8px;
    }

    .control-section {
      min-height: 38px;
      display: flex;
      gap: 5px;
      align-items: center;
      flex-wrap: wrap;
      padding: 6px;
      border: 1px solid #303030;
      background: #181818;
      border-radius: 6px;
    }

    .section-label {
      min-width: 78px;
      color: #d8d8d8;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .brand-strip {
      flex-basis: 100%;
      min-height: 34px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      color: #e8e8e8;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0;
    }
    .brand-logo {
      width: 26px;
      height: 26px;
      object-fit: contain;
      flex: 0 0 auto;
    }
    .brand-copy {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      line-height: 1.25;
    }
    .brand-copy strong {
      color: #fff;
      font-size: 13px;
    }
    .brand-pill {
      height: 22px;
      display: inline-flex;
      align-items: center;
      padding: 0 8px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      color: #dcdcdc;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }
    .brand-note {
      color: #b8b8b8;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    button, .file-btn, select, input[type="color"] {
      padding: 0 10px;
      height: 30px;
      line-height: 28px;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #ccc;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 700;
      text-transform: none;
      border-radius: 3px;
      outline: none;
      transition: all 0.2s ease;
      user-select: none;
    }
    button:hover, .file-btn:hover, select:hover { background: #444; color: #fff; border-color: #666; }
    button.active { background: #eee; color: #000; border-color: #fff; }
    button.primary-action {
      background: #f5f5f5;
      color: #050505;
      border-color: #fff;
      font-weight: 900;
    }
    button.secondary-action {
      background: #333;
      color: #f2f2f2;
      border-color: #555;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    input[type="color"] { padding: 0; width: 32px; border: none; overflow: hidden; }
    input[type="range"] {
      width: 80px; height: 4px; border-radius: 2px; background: #444;
      outline: none; appearance: none; -webkit-appearance: none; cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff;
    }
    #rngTitleSize,
    #rngArtistSize,
    #rngMetaSize,
    #rngBgZoom,
    #rngBgX,
    #rngBgY,
    #rngBgRot { width: 96px; }
    .native-font-select {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    .font-step {
      width: 30px;
      padding: 0;
      font-size: 12px;
    }
    .font-picker {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .font-picker-button {
      min-width: 156px;
      max-width: 188px;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .font-menu {
      position: absolute;
      top: 34px;
      left: 0;
      width: min(360px, 88vw);
      max-height: min(540px, calc(100vh - 120px));
      overflow: auto;
      padding: 6px;
      box-sizing: border-box;
      background: #181818;
      border: 1px solid #444;
      border-radius: 6px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.65);
      z-index: 2200;
      display: none;
    }
    .font-menu.open { display: block; }
    .font-menu-group {
      padding: 8px 8px 5px;
      color: #777;
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    .font-option {
      width: 100%;
      height: auto;
      min-height: 42px;
      padding: 7px 9px;
      margin: 0 0 3px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
      text-transform: none;
      background: #222;
      border-color: #333;
    }
    .font-option:hover,
    .font-option.is-preview {
      background: #313131;
      border-color: #777;
      color: #fff;
    }
    .font-option.is-active {
      background: #efefef;
      color: #050505;
      border-color: #fff;
    }
    .font-sample {
      min-width: 0;
      color: inherit;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .font-name {
      flex: 0 0 auto;
      max-width: 116px;
      color: #aaa;
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.1;
      overflow: hidden;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .font-option.is-active .font-name { color: #111; }
    .control-value {
      min-width: 66px;
      height: 30px;
      line-height: 28px;
      padding: 0 8px;
      box-sizing: border-box;
      background: #202020;
      border: 1px solid #383838;
      color: #aaa;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 800;
      text-transform: none;
      border-radius: 3px;
      text-align: center;
      user-select: none;
      white-space: nowrap;
    }

    /* Accessibility: keyboard focus visibility */
    button:focus-visible,
    .file-btn:focus-visible,
    select:focus-visible,
    input[type="color"]:focus-visible,
    input[type="range"]:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    [contenteditable="true"]:focus-visible {
      outline: 2px solid rgba(255,255,255,0.8);
      outline-offset: 3px;
      border-radius: 4px;
    }

    /* --- Canvas --- */
    #preview-wrapper {
      width: 100%;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      overflow: hidden;
    }

    #artwork-canvas {
      width: var(--base-size);
      height: var(--base-size);
      position: relative;
      background-color: var(--bg-color);
      overflow: hidden;
      box-shadow: 0 0 120px rgba(0,0,0,0.9);
      flex-shrink: 0;
      transform-origin: center center;
    }

    .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    .bg-layer { z-index: 1; transition: filter 0.3s; }
    .bg-layer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: var(--bg-x) var(--bg-y);
      display: block;
      transform: scale(var(--bg-zoom)) rotate(var(--bg-rot));
      transform-origin: center center;
      transition: transform 0.2s ease, object-position 0.2s ease;
    }
    .bg-layer.grayscale { filter: grayscale(100%) contrast(1.1); }

    .texture-layer {
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      mix-blend-mode: overlay;
    }
    .texture-layer.active { opacity: 0.12; }
    .texture-layer.noise {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    .layout-layer {
      z-index: 3;
      padding: var(--layout-padding);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .top-meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      font-family: 'Inter', sans-serif;
      font-size: var(--meta-size);
      letter-spacing: 1.5px;
      font-weight: 600;
      border-bottom: 2px solid var(--text-color);
      padding-bottom: 20px;
      color: var(--text-color);
      opacity: var(--meta-opacity);
      mix-blend-mode: var(--meta-blend);
    }
    .meta-item { outline: none; }

    .meta-item:nth-child(1) { text-align: left; }
    .meta-item:nth-child(2) { text-align: center; }
    .meta-item:nth-child(3) { text-align: right; }

    .bottom-content {
      display: flex;
      flex: 1;
      align-items: flex-end;
      justify-content: space-between;
      flex-direction: row;
      padding-top: 40px;
    }
    .bottom-content.layout-left { flex-direction: row-reverse; }
    .bottom-content.layout-center {
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      gap: 40px;
      text-align: center;
    }

    .logo-box {
      width: 140px; height: 140px;
      border: 2px dashed rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.02);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      z-index: 10;
      flex-shrink: 0;
    }
    .logo-box:hover { border-color: rgba(255,255,255,0.5); }
    .logo-box::after {
      content: "LOGO";
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: bold;
      color: rgba(255,255,255,0.3);
    }

    /* IMPORTANT: explicit filter chains for html2canvas compatibility */
    .logo-box img {
      width: 100%;
      height: auto;
      max-height: 140px;
      display: none;
      filter: none;
    }

    .logo-box.has-logo { border: none; background: transparent; }
    .logo-box.has-logo::after { display: none; }
    .logo-box.has-logo img { display: block; }

    .logo-box img.filter-white { filter: brightness(0) invert(1); }
    .logo-box img.filter-black { filter: brightness(0); }

    /* Shadows */
    .text-group {
      color: var(--text-color);
      mix-blend-mode: normal;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
      min-width: 0;
      flex: 1;
      padding-left: 20px;
      transform-origin: right bottom;
    }
    .bottom-content.layout-left .text-group {
      align-items: flex-start;
      text-align: left;
      padding-left: 0;
      padding-right: 20px;
      transform-origin: left bottom;
    }
    .bottom-content.layout-center .text-group {
      align-items: center;
      text-align: center;
      padding: 0;
      width: 100%;
      max-width: 100%;
      transform-origin: center center;
    }

    .artist {
      font-family: var(--artist-font);
      font-size: var(--artist-size);
      margin-bottom: 12px;
      outline: none;
      font-weight: var(--artist-weight);
    }

    .song {
      font-family: var(--song-font);
      font-size: var(--song-size, 82px);
      line-height: 0.9;
      letter-spacing: var(--song-spacing);
      outline: none;
      font-weight: var(--song-weight);
      text-transform: var(--song-transform);
      overflow: hidden;
      word-break: break-word;
    }

    .shadow-on .song { overflow: visible; }

    .shadow-on .artist,
    .shadow-on .song,
    .shadow-on .top-meta {
      text-shadow:
        0 2px 5px rgba(0,0,0,0.8),
        0 5px 20px rgba(0,0,0,0.5),
        0 15px 50px rgba(0,0,0,0.4);
    }

    /* PNG alpha-respecting shadow (apply to IMG for html2canvas compatibility) */
    .shadow-on .logo-box.has-logo img {
      filter:
        drop-shadow(0 2px 5px rgba(0,0,0,0.8))
        drop-shadow(0 5px 20px rgba(0,0,0,0.5))
        drop-shadow(0 15px 50px rgba(0,0,0,0.4));
    }

    .shadow-on .logo-box.has-logo img.filter-white {
      filter:
        brightness(0) invert(1)
        drop-shadow(0 2px 5px rgba(0,0,0,0.8))
        drop-shadow(0 5px 20px rgba(0,0,0,0.5))
        drop-shadow(0 15px 50px rgba(0,0,0,0.4));
    }

    .shadow-on .logo-box.has-logo img.filter-black {
      filter:
        brightness(0)
        drop-shadow(0 2px 5px rgba(0,0,0,0.8))
        drop-shadow(0 5px 20px rgba(0,0,0,0.5))
        drop-shadow(0 15px 50px rgba(0,0,0,0.4));
    }

    .safe-zone {
      z-index: 4;
      display: none;
      pointer-events: none;
    }
    .safe-zone.active { display: block; }
    .safe-zone::before,
    .safe-zone::after {
      content: "";
      position: absolute;
      inset: 60px;
      border: 1px solid rgba(0,240,255,0.45);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.35);
    }
    .safe-zone::after {
      inset: 110px;
      border-style: dashed;
      opacity: 0.65;
    }

    .validation-panel {
      min-width: min(720px, 94vw);
      max-width: min(920px, 94vw);
      height: auto;
      min-height: 30px;
      line-height: 1.35;
      padding: 7px 10px;
      color: #d8d8d8;
      text-align: left;
      white-space: normal;
      text-transform: none;
    }
    .validation-panel.ready { border-color: rgba(80,255,160,0.55); color: #d8ffe8; }
    .validation-panel.warn { border-color: rgba(255,200,80,0.65); color: #ffe9b8; }

    .export-status {
      min-width: min(420px, 94vw);
      max-width: min(620px, 94vw);
      height: auto;
      min-height: 30px;
      line-height: 1.35;
      padding: 7px 10px;
      color: #dcdcdc;
      text-align: left;
      white-space: normal;
      border-color: #383838;
    }
    .export-status.ready { border-color: rgba(80,255,160,0.55); color: #d8ffe8; }
    .export-status.warn { border-color: rgba(255,200,80,0.65); color: #ffe9b8; }

    /* Non-blocking toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      max-width: min(680px, 92vw);
      background: rgba(0,0,0,0.88);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 12px 36px rgba(0,0,0,0.5);
      z-index: 3000;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      line-height: 1.35;
      display: none;
      pointer-events: none;
      white-space: pre-wrap;
    }
    .toast.show { display: block; }
    .toast.error { border-color: rgba(255, 80, 80, 0.65); }
    .toast.warn  { border-color: rgba(255, 200, 80, 0.65); }
    .toast.ok    { border-color: rgba(80, 255, 160, 0.55); }

    @media (max-width: 760px) {
      .controls {
        max-height: 50vh;
        justify-content: flex-start;
        align-content: flex-start;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .control-group {
        flex: 1 0 100%;
        max-width: 100%;
        overflow-x: auto;
        padding: 0 0 7px;
        margin: 0;
        border-right: 0;
        border-bottom: 1px solid #333;
      }

      .start-mode {
        grid-template-columns: 1fr;
      }

      .start-actions {
        justify-content: flex-start;
        overflow-x: visible;
      }

      .pro-grid {
        display: block;
      }

      .control-section {
        margin-bottom: 7px;
        overflow-x: auto;
      }

      .brand-strip {
        justify-content: flex-start;
        align-items: flex-start;
      }

      .brand-copy {
        justify-content: flex-start;
      }

      .brand-note {
        flex-basis: 100%;
        white-space: normal;
      }

      .font-menu {
        position: fixed;
        inset: auto 8px 8px 8px;
        top: auto;
        width: auto;
        max-height: 46vh;
      }

      #preview-wrapper {
        min-height: 52vh;
        padding: 18px;
      }

      .toast {
        bottom: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="controls" id="controls">
    <section class="start-mode" aria-labelledby="coverStartTitle">
      <div class="brand-strip" aria-label="openFAD Cover Machine 信息">
        <img class="brand-logo" id="brandLogo" alt="openFAD logo">
        <div class="brand-copy">
          <span class="brand-pill">openFAD Cover Machine</span>
          <strong id="coverStartTitle">制作一张发行封面</strong>
          <span class="brand-pill">本地优先</span>
          <span class="brand-pill">中文优先</span>
          <span class="brand-note">示例素材为公开安全占位，不授予 FAD Records 品牌素材使用权。</span>
        </div>
      </div>

      const SESSION_KEY = 'openfad-cover-telemetry-session-v1';
      const ENDPOINT = '/creator/events';

      const getSessionId = () => {
        try {
          const existing = localStorage.getItem(SESSION_KEY);
          if (existing) return existing;
          const id = (crypto?.randomUUID?.() || `openfad-${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`);
          localStorage.setItem(SESSION_KEY, id);
          return id;
        } catch (_) {
          return `openfad-${Date.now().toString(36)}`;
        }

        const ctx = window.OPENFAD_CREATOR_CONTEXT || {};
        if (ctx.slug) return ctx.slug;
        return location.pathname.split('/').filter(Boolean).pop() || 'app';
      };

        try {
          if (!isTelemetryEnabled()) return;
          const ctx = window.OPENFAD_CREATOR_CONTEXT || {};
          const payload = {
            event,
            sessionId: getSessionId(),
            route: getRoute(),
            source: ctx.source || 'openfad-cover-v1',
            details: {
              ...details,
              viewportWidth: window.innerWidth || 0,
              viewportHeight: window.innerHeight || 0
            }
          };
          const body = JSON.stringify(payload);

          if (navigator.sendBeacon && typeof Blob === 'function') {
            const blob = new Blob([body], { type: 'application/json' });
            if (navigator.sendBeacon(ENDPOINT, blob)) return;
          }

          fetch(ENDPOINT, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body,
            credentials: 'same-origin',
            keepalive: true
          }).catch(() => {});
        } catch (err) {
          Logger.debug('Telemetry skipped:', err);
        }
      };

      return { track };

      const ensureFont = (family) => {
        try {

          const href = FONT_URLS[family];
          if (!href) return;

          if (pending.has(family)) return;

          const attr = escAttr(family);
          const existing = document.querySelector(`link[data-dyn-font="${attr}"]`);
          if (existing) {
            pending.set(family, Promise.resolve().then(() => loadedFonts.add(family)));
            return;
          }

          const link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = href;
          link.dataset.dynFont = family;
          link.setAttribute('data-dyn-font', family);

          const p = new Promise((resolve) => {
            let settled = false;
            const finish = (ok) => {
              if (settled) return;
              settled = true;
              if (ok) loadedFonts.add(family);
              resolve();
            };

            link.onload = () => finish(true);
            link.onerror = () => {
              Toast.show(`Font load failed: ${family}`, 'warn');
              finish(false);
            };

            setTimeout(() => finish(false), FONT_LOAD_TIMEOUT_MS);
          });

          pending.set(family, p);
          document.head.appendChild(link);
        } catch (err) {
          Logger.warn('ensureFont failed:', err);
        }
      };

      const settleOne = (img) => {
        const done = () => ({ img, ok: img.naturalWidth > 0 });

        if (img.complete) return Promise.resolve(done());

        const eventPromise = new Promise((resolve) => {
          let settled = false;
          const onEnd = () => {
            if (settled) return;
            settled = true;
            img.removeEventListener('load', onEnd);
            img.removeEventListener('error', onEnd);
            resolve(done());
          };

          img.addEventListener('load', onEnd);
          img.addEventListener('error', onEnd);
        });

        const decodePromise = typeof img.decode === 'function'
          ? img.decode().then(done).catch(done)
          : eventPromise;

        return Promise.race([
          decodePromise,
          eventPromise,
          new Promise((resolve) => setTimeout(() => resolve(done()), timeoutMs))
        ]);
      };

      return Promise.all(imgs.map(settleOne));

      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return null;

      const range = sel.getRangeAt(0);
      if (!el.contains(range.startContainer) || !el.contains(range.endContainer)) return null;

      const startRange = range.cloneRange();
      startRange.selectNodeContents(el);
      startRange.setEnd(range.startContainer, range.startOffset);
      const start = startRange.toString().length;

      const endRange = range.cloneRange();
      endRange.selectNodeContents(el);
      endRange.setEnd(range.endContainer, range.endOffset);
      const end = endRange.toString().length;

      return { start, end };

    const setSelectionOffsets = (el, start, end) => {
      const safeStart = Math.max(0, start | 0);
      const safeEnd = Math.max(safeStart, end | 0);
      const range = document.createRange();
      const sel = window.getSelection();

      let cursor = 0;
      let startNode = null;
      let startOffset = 0;
      let endNode = null;
      let endOffset = 0;

      const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      while (walker.nextNode()) {
        const node = walker.currentNode;
        const len = node.textContent ? node.textContent.length : 0;
        const next = cursor + len;

        if (!startNode && safeStart <= next) {
          startNode = node;
          startOffset = Math.min(len, safeStart - cursor);
        }

        if (!endNode && safeEnd <= next) {
          endNode = node;
          endOffset = Math.min(len, safeEnd - cursor);
          break;
        }

        cursor = next;
      }

      if (!startNode) {
        if (el.firstChild && el.firstChild.nodeType === Node.TEXT_NODE) {
          startNode = el.firstChild;
          startOffset = el.firstChild.textContent ? el.firstChild.textContent.length : 0;
        } else {
          const textNode = document.createTextNode('');
          el.appendChild(textNode);
          startNode = textNode;
          startOffset = 0;
        }
      }

      if (!endNode) {
        endNode = startNode;
        endOffset = startOffset;
      }

      range.setStart(startNode, startOffset);
      range.setEnd(endNode, endOffset);
      sel.removeAllRanges();
      sel.addRange(range);

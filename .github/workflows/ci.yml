name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci --prefix apps/motion-batch
      - run: npm run scan:public
      - run: npm test
      - run: npm run package:web
      - run: npm run checksums
      - run: npm run release:manifest
